# A one-off verification of the stress matrix plumbing, deleted once it has run.
#
# `workflow_dispatch` only fires for workflows which exist on the default branch, so
# the stress matrix itself cannot be triggered from this branch.  This runs instead,
# on a push, and its job is narrow: generate a few configurations with the real
# generator and simulate one of them, which is the part the local checks cannot
# reach - pycde is only published for x86_64.

name: Verify the stress matrix

on:
  push:
    paths:
      - ".github/workflows/verify-stress.yml"
      - "tools/stress_matrix.py"
      - "pycde_example/fft_matrix.py"
      - "pycde_example/fft_tb.py"
      - "pycde_example/cocotb_runner.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Install verilator
        uses: veryl-lang/setup-verilator@v2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          export COCOTB_IGNORE_PYTHON_REQUIRES="True"
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Generate a shard with the real generator
        run: |
          mkdir -p build
          python tools/stress_matrix.py --shard 0 --shards 20 \
            --output build/stress --rtl build/ip_fft_lib
          echo "--- how much was generated ---"
          find build/ip_fft_lib -name "*.sv" | wc -l
          ls build/stress/stress_tests | head -5

      - name: Simulate a representative few
        env:
          FFT_STRESS_MANIFEST: build/stress/manifest.json
          PYTHONPATH: build/stress
        run: |
          # The whole shard is what the real matrix runs; here the point is whether
          # the plumbing carries the real thing to a simulator.  The two point and
          # four point shapes are enough: they touch every topology, and they are
          # the cheapest to build.
          pytest build/stress/stress_tests -q -k "p2 or p4" --durations=5

      - name: Report the result
        if: always()
        run: |
          echo "manifest entries: $(python -c 'import json;print(len(json.load(open("build/stress/manifest.json"))))')"
