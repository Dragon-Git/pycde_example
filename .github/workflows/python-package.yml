# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Install verilator
      uses: veryl-lang/setup-verilator@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        export COCOTB_IGNORE_PYTHON_REQUIRES="True"
        python -m pip install --upgrade pip
        python -m pip install -e '.[dev]'
        pip install tox-gh-actions

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check .

    - name: Generate RTL
      run: |
        mkdir build
        python pycde_example/*.py
        python -m pycde_example.mini_riscv
        python -m pycde_example.cordic

    - name: Dump CORDIC RTL
      run: |
        ls build/ip_cordic_lib/
        cat build/ip_cordic_lib/CordicLoopRotW32I16/hw/Cordic.sv
        cat build/ip_cordic_lib/CordicPipelinedRotW24I12/hw/Cordic.sv

    - name: Test with pytest
      run: |
        python pycde_example/ahb_ram.py
        python pycde_example/ahb_to_ram.py
        pytest pycde_example -n auto

    - name: Upload coverage to codecov
      run: |
        pip install codecov
        codecov
